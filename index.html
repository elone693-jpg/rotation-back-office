    if(el.dataset.evit!==undefined){c.eviter=[...card.querySelectorAll('[data-evit]')].filter(x=>x.checked).map(x=>+x.dataset.evit)}
    if(el.dataset.dbl){const t=card.querySelector('[data-dbl=tuteur]').value,j=card.querySelector('[data-dbl=jusqu]')?.value||c.doublure?.jusqu||addDays(TODAY,14);if(t)c.doublure={tuteur:t,jusqu:j};else delete c.doublure}
    if(el.dataset.f){c[el.dataset.f]=el.type==='checkbox'?el.checked:el.value.trim();if(el.dataset.f==='nom'&&!c.nom)c.nom='Sans nom'}
    if(c.debut&&c.fin&&c.fin<c.debut){toast("La date de départ précède l'arrivée.");return}
    put('equipe',id,c);return}
  const tr=el.closest('tr[data-tid]');
  if(tr&&el.dataset.tf){const id=tr.dataset.tid,t={...state.taches[id]};let v=el.value.trim();if(el.dataset.tf==='nom'&&!v)v='Tâche sans nom';t[el.dataset.tf]=v;put('taches',id,t);return}
  if(el.dataset.rf){const R={...reglages()};let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.rf==='parJour')v=Math.max(1,Math.min(5,parseInt(v,10)||1));if(el.dataset.rf==='seuil')v=Math.max(1,Math.min(20,parseInt(v,10)||2));R[el.dataset.rf]=v;if(!R.debut)return;put('reglages','general',R);return}
  if(el.id==='ord-from'&&ui.orderDraft){ui.orderDraft.applyFrom=el.value||ui.orderDraft.from;render();return}
  if(el.dataset.vol){const d=el.dataset.d,j=journal(d),vol={...(j.vol||{})};const n=el.value===''?null:Math.max(0,Math.min(9999,parseInt(el.value,10)||0));if(n===null)delete vol[el.dataset.vol];else vol[el.dataset.vol]=n;jput(d,{...j,done:j.done||{},vol});return}
  if(el.closest('#absform')&&/^a-(collab|du|au|portion)$/.test(el.id)){if(el.id==='a-du'){const au=$('#a-au');if(au&&au.value<el.value)au.value=el.value}absImpact();return}
  if(el.dataset.todo){tick(el.dataset.d,el.dataset.todo,el.checked);return}
  if(el.dataset.jnote){const d=el.dataset.jnote,j=journal(d);if((j.note||'')!==el.value.trim())jput(d,{...j,done:j.done||{},note:el.value.trim()});return}
  if(el.dataset.recau){const id=el.dataset.recau,a={...state.absences[id]};if(el.value&&el.value<a.du){toast('La date de fin doit suivre la date de début.');return}a.au=el.value||'';put('absences',id,a);toast(el.value?`Récurrence arrêtée après le ${short(el.value)}.`:'Récurrence sans date de fin.');return}
  if(el.closest('#recform')&&(el.name==='r-jours'||/^r-(tous|rang|jour)$/.test(el.id))){ui.recForm=readRecForm();return}
  if(el.id==='a-du'){const au=$('#a-au');if(au&&au.value<el.value)au.value=el.value}
});
function readRecForm(){const f=$('#recform');const o={...(ui.recForm||{freq:'hebdo',tous:'1',jours:[2],rang:'1',jour:'0'})};if(!f)return o;
  const js=[...f.querySelectorAll('input[name=r-jours]:checked')].map(i=>+i.value);if(f.querySelector('input[name=r-jours]'))o.jours=js;
  const g=id=>f.querySelector('#'+id)?.value;if(g('r-tous'))o.tous=g('r-tous');if(g('r-rang'))o.rang=g('r-rang');if(g('r-jour'))o.jour=g('r-jour');return o}
document.addEventListener('submit',e=>{
  if(e.target.id==='recform'){e.preventDefault();const v=id=>$('#'+id).value,err=$('#r-err');const rf=readRecForm();
    const du=v('r-du'),au=v('r-au');
    if(!v('r-collab')){err.textContent="Ajoutez d'abord un collaborateur dans l'onglet Équipe.";return}
    if(!du){err.textContent='Indiquez la date de début.';return}
    if(au&&au<du){err.textContent='La date de fin doit suivre la date de début.';return}
    const rec=rf.freq==='mensuel'?{freq:'mensuel',rang:+rf.rang,jour:+rf.jour}:{freq:'hebdo',jours:rf.jours,tous:+rf.tous};
    if(rec.freq==='hebdo'&&!rec.jours.length){err.textContent='Cochez au moins un jour.';return}
    put('absences',uid('a'),{collab:v('r-collab'),du,au:au||'',type:v('r-type'),portion:v('r-portion'),note:v('r-note').trim(),rec});
    ui.recForm=rf;toast('Absence récurrente enregistrée. Le planning en tient compte.');return}
  if(e.target.id!=='absform')return;e.preventDefault();
  const v=id=>$('#'+id).value;const du=v('a-du'),au=v('a-au');
  if(!v('a-collab')){$('#a-err').textContent="Ajoutez d'abord un collaborateur dans l'onglet Équipe.";return}
  if(!du||!au||au<du){$('#a-err').textContent='La date de fin doit être égale ou postérieure à la date de début.';return}
  put('absences',uid('a'),{collab:v('a-collab'),du,au,type:v('a-type'),portion:v('a-portion'),note:v('a-note').trim()});
  toast(`Absence enregistrée (${workdays(du,au)} j ouvré${workdays(du,au)>1?'s':''}).`);
});
document.addEventListener('input',e=>{if(e.target.dataset.acct){acctSearch(e.target.dataset.acct,e.target.value);return}});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.acct)acctSearch(e.target.dataset.acct,e.target.value)});
document.addEventListener('input',e=>{if(e.target.id!=='bulk-text')return;ui.bulkText=e.target.value;const p=$('#bulk-preview');if(p)p.innerHTML=bulkPreview()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').innerHTML)closeModal()});

let tt;function toast(m){clearTimeout(tt);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;tt=setTimeout(()=>t.remove(),3200)}

/* ---------- démarrage ---------- */
render();
(async()=>{
  let d=null;try{d=window.claude?await window.claude.use('db'):null}catch(e){d=null}
  if(!d){mode='local';localLoad();render();return}
  db=d;mode='db';
  try{const u=await window.claude.use('user');if(u){userNs=u;try{myId=await u.id()}catch(e){myId=null}let w=await u.can('data.write');if(w===null||w===undefined){try{w=await u.canEdit()}catch(e){w=null}}if(w===false)canWrite=false}}catch(e){}
  for(const col of COLS){
    db.collection(col).onSnapshot(snap=>{
      const m={};snap.docs.forEach(doc=>{if(doc.exists)m[doc.id]=doc.data()});
      state[col]=m;loaded.add(col);if(loaded.size===COLS.length)render();
    },err=>{if(err&&err.code==='revoked'){canWrite=false;render()}});
  }
  setTimeout(()=>{if(loaded.size<COLS.length){COLS.forEach(c=>loaded.add(c));render()}},6000);
})();
})();
</script>
