<title>Rotation Back Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : barre d'outils + onglets en haut, grille hebdomadaire (postes × jours) au centre, panneaux de gestion dans les autres onglets */
/* Layout : bandeau d'accueil (qui est de back office aujourd'hui), onglets en pilule collants, grille hebdomadaire puis panneaux */
:root{
  --bg:#eef4f5; --surface:#ffffff; --surface-2:#f2f7f8; --line:#dce7ea; --ink:#0d2a33; --muted:#5b7179;
  --brand:#009cac; --brand-red:#ed1c24; --accent:#007f8c; --accent-ink:#ffffff; --accent-soft:#dff2f4;
  --hero-a:#00a3b4; --hero-b:#0b4a5c; --hero-ink:#ffffff;
  --crit:#c8102e; --crit-soft:#fde8ea; --warn:#9a5a00; --warn-soft:#fff2dc; --info:#1f5fa8; --info-soft:#e4eefb;
  --c1:#009cac; --c2:#e0452f; --c3:#2d4f9e; --c4:#d98a00; --c5:#8a4fbf; --c6:#2e8b57; --c7:#c2407a; --c8:#5a6f8a;
  --shadow:0 1px 2px rgb(13 42 51 / .05),0 10px 28px -14px rgb(13 42 51 / .22);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; --R:16px;
  --k-conge:var(--info); --k-rtt:color-mix(in oklab,var(--info) 55%,var(--surface)); --k-maladie:var(--crit); --k-formation:var(--warn); --k-autre:var(--muted); --k-tempspartiel:var(--c5);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08171c; --surface:#0f242b; --surface-2:#153039; --line:#21424c; --ink:#e4f1f3; --muted:#8eaab2;
  --brand:#2cc3d1; --brand-red:#ff5a5f; --accent:#3cc6d3; --accent-ink:#03222a; --accent-soft:#123b44;
  --hero-a:#007c8a; --hero-b:#0a2f3b; --hero-ink:#ffffff;
  --crit:#ff7b84; --crit-soft:#3a1519; --warn:#f0b65a; --warn-soft:#352711; --info:#8bb8f0; --info-soft:#152a42;
  --c1:#2cc3d1; --c2:#ff7a62; --c3:#7f9fe8; --c4:#f2b23c; --c5:#b98be6; --c6:#5cc48a; --c7:#ee7fae; --c8:#9fb0c6;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 28px -14px rgb(0 0 0 / .6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08171c; --surface:#0f242b; --surface-2:#153039; --line:#21424c; --ink:#e4f1f3; --muted:#8eaab2;
  --brand:#2cc3d1; --brand-red:#ff5a5f; --accent:#3cc6d3; --accent-ink:#03222a; --accent-soft:#123b44;
  --hero-a:#007c8a; --hero-b:#0a2f3b; --hero-ink:#ffffff;
  --crit:#ff7b84; --crit-soft:#3a1519; --warn:#f0b65a; --warn-soft:#352711; --info:#8bb8f0; --info-soft:#152a42;
  --c1:#2cc3d1; --c2:#ff7a62; --c3:#7f9fe8; --c4:#f2b23c; --c5:#b98be6; --c6:#5cc48a; --c7:#ee7fae; --c8:#9fb0c6;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 28px -14px rgb(0 0 0 / .6);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--accent)} .status.local i{background:var(--warn)}

nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button .n{font-family:var(--mono);font-size:.75rem;margin-left:6px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--crit)}
.btn.danger.armed{background:var(--crit);color:var(--surface);border-color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:var(--r);cursor:pointer;display:inline-grid;place-items:center}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.weeknav{display:flex;align-items:center;gap:8px}
.weeklabel{display:grid;line-height:1.2;min-width:12ch}
.weeklabel b{font-size:1.05rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}

.summary{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.82rem;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill b{font-family:var(--mono);font-weight:500}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.info{background:var(--info-soft);color:var(--info)}

.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:.88rem}

.grid-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
table.plan{min-width:820px;table-layout:fixed}
table.plan th,table.plan td{border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.plan td{border-left:1px solid var(--line);padding:6px}
table.plan thead th{padding:10px 8px;font-weight:600;background:var(--surface)}
table.plan thead th.corner{width:200px}
.dhead{display:flex;align-items:baseline;gap:8px}
.dhead .dnum{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
th.today .dhead .dname{color:var(--accent)}
th.today{box-shadow:inset 0 -3px 0 var(--accent)}
td.today{background:color-mix(in oklab,var(--accent-soft) 35%,transparent)}
.ftag{display:block;font-size:.72rem;font-weight:500;color:var(--warn)}
tr.slot th{background:var(--surface-2);padding:6px 12px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
th.task{padding:10px 12px;font-weight:600}
th.task .tmeta{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
tr.sub th{padding:8px 12px;font-weight:500;font-size:.82rem;color:var(--muted)}
td.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px)}
.cell{width:100%;min-height:44px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;background:none;border:1px dashed transparent;border-radius:6px;padding:4px;cursor:pointer;text-align:left;position:relative}
.cell:hover{border-color:var(--line);background:var(--surface-2)}
.cell[disabled]{cursor:default}
.cell[disabled]:hover{border-color:transparent;background:none}
.cell.short{border-color:var(--crit);border-style:solid;background:var(--crit-soft)}
.cell .flag{font-size:.7rem;font-weight:600;padding:1px 6px;border-radius:999px}
.cell .flag.crit{background:var(--crit);color:var(--surface)}
.cell .flag.man{background:var(--info-soft);color:var(--info)}
.chip{--h:var(--c1);display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 2px;border-radius:999px;background:color-mix(in oklab,var(--h) 16%,var(--surface));color:var(--ink);font-size:.82rem;font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:999px;background:var(--h);color:var(--surface);font-size:.68rem;font-weight:700;letter-spacing:.02em}
.chip.sm{font-size:.76rem;padding-right:6px}
.chip.sm b{min-width:18px;height:18px;font-size:.62rem}
.chip.out{opacity:.55;text-decoration:line-through}
.abs{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.76rem;font-weight:500;white-space:nowrap}
.abs.conge,.abs.rtt{background:var(--info-soft);color:var(--info)}
.abs.maladie{background:var(--crit-soft);color:var(--crit)}
.abs.formation{background:var(--warn-soft);color:var(--warn)}
.abs.autre{background:var(--surface-2);color:var(--muted)}
.abs.tempspartiel{background:color-mix(in oklab,var(--c5) 14%,var(--surface));color:var(--c5)}
.stack{display:flex;flex-wrap:wrap;gap:4px}

table.people{min-width:760px;table-layout:fixed}
table.people th,table.people td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.people td{border-left:1px solid var(--line)}
table.people thead th{font-weight:600}
table.people th:first-child{width:190px}
.duty{display:grid;gap:3px;font-size:.84rem}
.duty span{display:flex;gap:6px}
.duty em{font-style:normal;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;width:4.2em;flex:none;padding-top:2px}
.free{color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500;min-width:0}
label.f.grow{flex:1 1 180px}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:.92rem;min-width:0;width:100%}
input[type=number]{width:5.5em}
.check{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;cursor:pointer}
.list{display:grid;gap:10px}
.person{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;background:var(--surface)}
.person.off{background:var(--surface-2)}
.person-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{--h:var(--c1);width:36px;height:36px;border-radius:50%;background:var(--h);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{--h:var(--c1);width:22px;height:22px;border-radius:50%;background:var(--h);border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.skills{display:flex;flex-wrap:wrap;gap:6px 14px}
.absrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.absrow:last-child{border-bottom:0}
.absrow .when{font-family:var(--mono);font-size:.84rem}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}

table.eq th,table.eq td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem}
table.eq thead th{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;vertical-align:bottom}
table.eq td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:8px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.75}
.bar i.lo{background:var(--warn)}

table.tasks th,table.tasks td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tasks thead th{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

.empty{display:grid;gap:10px;justify-items:start;padding:28px;background:var(--surface);border:1px dashed var(--line);border-radius:10px}

.overlay{position:fixed;inset:0;background:color-mix(in oklab,var(--ink) 40%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:12px;padding:18px;width:min(440px,100%);display:grid;gap:14px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.opt.dis{opacity:.6}
.opt small{margin-left:auto;color:var(--muted);font-size:.76rem;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:30}
@media (prefers-reduced-motion:no-preference){.cell,.btn{transition:background .12s,border-color .12s}}
.chip.big{font-size:.9rem;padding:3px 10px 3px 3px}
.chip.big b{min-width:26px;height:26px;font-size:.72rem}
.cell.duty-cell{min-height:52px;align-items:center}
.cell .flag.warn{background:var(--warn-soft);color:var(--warn)}
.bo{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.turns{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 16px}
.turn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);min-width:0}
.turn .mono{font-size:.84rem;color:var(--muted);white-space:nowrap}
.bulk-list{display:grid;gap:4px;max-height:320px;overflow:auto}
.bulk-row{display:grid;grid-template-columns:2ch minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;background:var(--surface-2);font-size:.85rem}
.bulk-row.bad{background:var(--crit-soft)} .bulk-row.skip{opacity:.6}
textarea{font-family:var(--mono);font-size:.85rem;line-height:1.6;resize:vertical}
table.cal{border-collapse:separate;border-spacing:2px;width:auto}
table.cal th,table.cal td{padding:0}
table.cal td{width:16px;min-width:16px;height:22px;background:var(--surface-2);border-radius:3px;position:relative}
table.cal td i{position:absolute;inset:0;border-radius:3px}
.cal-m{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:0 0 4px 2px!important;font-weight:600}
.cal-d{font-family:var(--mono);font-size:.62rem;color:var(--muted);font-weight:400;text-align:center}
.cal-n{position:sticky;left:0;background:var(--surface);padding-right:8px!important;text-align:left;z-index:1}
td.cal-w,th.cal-w{box-shadow:inset 2px 0 0 var(--line)}
th.cal-t{color:var(--accent);font-weight:700}
td.cal-t{outline:2px solid var(--accent);outline-offset:-1px}
.cal-f{background:repeating-linear-gradient(135deg,var(--surface-2) 0 3px,var(--line) 3px 5px)!important}
.key{display:inline-block;width:12px;height:12px;border-radius:3px}
.ords{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ord{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;flex-wrap:wrap}
.ord:nth-child(odd){background:var(--surface-2)}
.ord.chg{box-shadow:inset 3px 0 0 var(--info)}
.ord-n{width:2ch;color:var(--muted);text-align:right}
.ord-d{margin-left:auto;font-size:.84rem;white-space:nowrap}
.ord-d s{color:var(--muted)}
.ord-b{display:flex;gap:4px}
.ord-b .icon-btn{width:30px;height:30px}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.ord-apply{justify-content:space-between;align-items:flex-end;padding-top:8px;border-top:1px solid var(--line)}
fieldset.modes{border:0;padding:0;margin:0;display:grid;gap:6px}
fieldset.modes legend{margin-bottom:6px}
fieldset.modes .opt{align-items:flex-start}
.conseq{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.86rem}
.conseq ul{margin:6px 0 0;padding-left:18px;display:grid;gap:2px}
.conseq s{color:var(--muted)}

/* ---------- habillage moderne ---------- */
body{font-size:15px;letter-spacing:-.005em}
h1{font-size:clamp(1.6rem,3.2vw,2.15rem);font-weight:800;letter-spacing:-.025em}
h2{font-weight:700;letter-spacing:-.015em}
h3{font-weight:700}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px;color:var(--hero-ink);
  background:radial-gradient(120% 140% at 100% 0%,rgb(255 255 255 / .16) 0 18%,transparent 19%),radial-gradient(90% 120% at 100% 0%,rgb(255 255 255 / .10) 0 32%,transparent 33%),linear-gradient(125deg,var(--hero-a),var(--hero-b));
  display:flex;flex-wrap:wrap;gap:20px 32px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;left:28px;top:0;width:56px;height:4px;border-radius:0 0 4px 4px;background:var(--brand-red)}
.hero-main{display:grid;gap:6px;min-width:0}
.hero-eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;opacity:.85}
.hero .status{color:rgb(255 255 255 / .85)}
.hero .status i{background:#9ff3e8;box-shadow:0 0 0 3px rgb(159 243 232 / .25)}
.hero .status.local i{background:#ffd27a;box-shadow:0 0 0 3px rgb(255 210 122 / .25)}
.hero-today{display:flex;gap:12px;flex-wrap:wrap}
.today-card{background:rgb(255 255 255 / .13);border:1px solid rgb(255 255 255 / .22);backdrop-filter:blur(6px);border-radius:16px;padding:12px 16px;display:grid;gap:6px;min-width:190px}
.today-card .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.85}
.today-card .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.today-card .who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:800;background:#fff;color:var(--hero-b)}
.today-card.next{background:rgb(255 255 255 / .07)}
.today-card .sub{font-size:.8rem;opacity:.8}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:999px;background:color-mix(in oklab,var(--surface) 88%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow);overflow-x:auto;width:max-content;max-width:100%}
nav.tabs button{border:0;border-radius:999px;padding:8px 16px;color:var(--muted);font-weight:600;font-size:.9rem}
nav.tabs button:hover{color:var(--ink);background:var(--surface-2)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-bottom-color:transparent}
nav.tabs button[aria-selected="true"] .n{color:var(--accent-ink);opacity:.8}

.btn{border-radius:999px;padding:8px 16px;font-weight:600;box-shadow:0 1px 1px rgb(13 42 51 / .04)}
.btn.primary{box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{box-shadow:none}
.icon-btn{border-radius:50%;font-size:1.05rem}
.icon-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.seg{border-radius:999px;padding:3px;gap:2px;background:var(--surface-2);border-color:var(--line)}
.seg button{border-radius:999px;padding:6px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgb(13 42 51 / .12)}
.pill{padding:5px 12px;font-weight:600;font-size:.8rem}

<script>
(function(){
"use strict";
/* ---------- utilitaires dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const weekday=s=>(parse(s).getDay()+6)%7;
const monday=s=>addDays(s,-weekday(s));
const ordinal=s=>{const[y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const TODAY=globalThis.__TODAY__||iso(new Date()); // __TODAY__ : date imposée par les scripts (rappel, tests)
const CUR=()=>weekday(TODAY)>4?addDays(monday(TODAY),7):monday(TODAY);
const DN=['Lun','Mar','Mer','Jeu','Ven'];
const DNL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const short=s=>{const d=parse(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const longd=s=>{const d=parse(s);return `${d.getDate()} ${MOIS[d.getMonth()]}`};
function isoWeek(s){const d=parse(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return iso(new Date(y,mo-1,da))}
const ferieCache={};
function feries(y){if(ferieCache[y])return ferieCache[y];const e=easter(y);return ferieCache[y]={[`${y}-01-01`]:"Jour de l'an",[addDays(e,1)]:"Lundi de Pâques",[`${y}-05-01`]:"Fête du Travail",[`${y}-05-08`]:"8 mai 1945",[addDays(e,39)]:"Ascension",[addDays(e,50)]:"Lundi de Pentecôte",[`${y}-07-14`]:"Fête nationale",[`${y}-08-15`]:"Assomption",[`${y}-11-01`]:"Toussaint",[`${y}-11-11`]:"Armistice",[`${y}-12-25`]:"Noël"}}
const ferieName=s=>feries(+s.slice(0,4))[s]||'';
function workdays(a,b){let n=0;for(let d=a;d<=b;d=addDays(d,1))if(weekday(d)<5&&!ferieName(d))n++;return n}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SLOTS=[{id:'matin',label:'Matin'},{id:'apresmidi',label:'Après-midi'}];
const SLOTL={matin:'Matin',apresmidi:'Ap.-midi'};
const ABS={conge:'Congé',rtt:'RTT',maladie:'Maladie',formation:'Formation',tempspartiel:'Temps partiel',autre:'Autre'};
const RANG={1:'1er',2:'2e',3:'3e',4:'4e',5:'dernier'};
const PORT={journee:'Journée',matin:'Matin',apresmidi:'Après-midi'};
const NCOL=8;

/* ---------- données par défaut (équipe type à renommer) ---------- */
function defaults(){
  const start=addDays(monday(TODAY),-14);
  return {
    taches:{
      t_mails:{nom:'Traitement des mails',desc:"Boîte mail de l'agence",creneau:'matin',ordre:1},
      t_alertes:{nom:'Alertes de départs',desc:'Suivi et traitement des alertes',creneau:'matin',ordre:2},
      t_perso:{nom:'Boîte mail personnel',desc:'Gestion de la boîte du personnel',creneau:'matin',ordre:3},
      t_appels:{nom:"Émission d'appels",desc:'Appels sortants',creneau:'apresmidi',ordre:4}
    },
    equipe:{
      c1:{nom:'Collaborateur 1',couleur:1,actif:true,debut:'',fin:'',ordre:1},
      c2:{nom:'Collaborateur 2',couleur:2,actif:true,debut:'',fin:'',ordre:2},
      c3:{nom:'Collaborateur 3',couleur:3,actif:true,debut:'',fin:'',ordre:3},
      c4:{nom:'Collaborateur 4',couleur:4,actif:true,debut:'',fin:'',ordre:4},
      c5:{nom:'Collaborateur 5 (à recruter)',couleur:5,actif:false,debut:'',fin:'',ordre:5}
    },
    absences:{},affectations:{},ordres:{},
    reglages:{general:{debut:start,feries:true,parJour:1}}
  };
}

/* ---------- état et stockage ---------- */
const COLS=['equipe','taches','absences','affectations','reglages','ordres','liens','journal'];
const state={equipe:{},taches:{},absences:{},affectations:{},reglages:{},ordres:{},liens:{},journal:{}};
let mode='init', db=null, canWrite=true, loaded=new Set();
const LS='rotation-bo-v1';
const ui={tab:'planning',week:CUR(),view:'poste',eqPeriod:'4w'};
try{Object.assign(ui,JSON.parse(localStorage.getItem(LS+'-ui')||'{}'));ui.week=CUR()}catch(e){}
const saveUi=()=>{try{localStorage.setItem(LS+'-ui',JSON.stringify({tab:ui.tab,view:ui.view,eqPeriod:ui.eqPeriod,absMode:ui.absMode}))}catch(e){}};

function localLoad(){
  let d=null;try{d=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
  Object.assign(state,d||defaults());
}
function localSave(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}

async function put(col,id,data){
  if(!canWrite){toast('Lecture seule : vous ne pouvez pas modifier ce planning.');return}
  state[col]={...state[col],[id]:data};render();
  if(mode==='db'){
    try{await db.collection(col).doc(id).set(data)}
    catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;render();toast('Modification refusée : accès en lecture seule.')}else toast("Enregistrement impossible pour l'instant. Réessayez.")}
  } else localSave();
}
async function del(col,id){
  if(!canWrite)return;
  const c={...state[col]};delete c[id];state[col]=c;render();
  if(mode==='db'){try{await db.collection(col).doc(id).delete()}catch(e){toast('Suppression impossible pour l\'instant.')}}
  else localSave();
}
async function seedDefaults(){
  const d=defaults();
  for(const col of COLS)for(const [id,v] of Object.entries(d[col]))await put(col,id,v);
  toast('Équipe type créée : renommez les collaborateurs dans l\'onglet Équipe.');
}

/* ---------- accès aux données ---------- */
const reglages=()=>({debut:addDays(monday(TODAY),-14),feries:true,parJour:1,...(state.reglages.general||{})});
const collabs=()=>Object.entries(state.equipe).map(([id,v],i)=>({id,...v})).sort((a,b)=>(a.ordre??99)-(b.ordre??99)||a.nom.localeCompare(b.nom));
const taches=()=>Object.entries(state.taches).map(([id,v])=>({id,...v})).sort((a,b)=>(a.creneau===b.creneau?0:a.creneau==='matin'?-1:1)||(a.ordre??99)-(b.ordre??99));
const byId=()=>Object.fromEntries(collabs().map((c,i)=>[c.id,c]));
const enDoublure=(c,d)=>!!(c&&c.doublure&&c.doublure.tuteur&&c.doublure.jusqu&&d<=c.doublure.jusqu);
const inRotation=(c,d)=>c.actif&&(!c.debut||c.debut<=d)&&(!c.fin||c.fin>=d);
const initials=n=>{const w=String(n||'?').replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean);return ((w[0]||'?')[0]+(w.length>1?(/\d/.test(w[1])?w[1]:w[1][0]):'')).toUpperCase().slice(0,3)};
const hue=c=>`var(--c${((c?.couleur||1)-1)%NCOL+1})`;
const chip=(c,cls='')=>c?`<span class="chip ${cls}" style="--h:${hue(c)}"><b>${esc(initials(c.nom))}</b>${esc(c.nom)}</span>`:'';
/* une absence récurrente couvre un jour si la date est dans sa période et suit son motif (hebdo ou mensuel) */
function recMatch(r,du,d){
  const wd=weekday(d);
  if(r.freq==='mensuel'){if(wd!==+r.jour)return false;const dm=+d.slice(8);
    if(+r.rang===5)return addDays(d,7).slice(5,7)!==d.slice(5,7);return Math.ceil(dm/7)===+r.rang}
  if(!(r.jours||[]).includes(wd))return false;
  const n=Math.max(1,+r.tous||1);if(n===1)return true;
  return Math.round((ordinal(monday(d))-ordinal(monday(du)))/7)%n===0;
}
function recLabel(a){const r=a.rec,J=DNL.map(x=>x.toLowerCase());
  if(r.freq==='mensuel')return `Le ${RANG[r.rang]} ${J[r.jour]} de chaque mois`;
  const js=(r.jours||[]).slice().sort((x,y)=>x-y).map(i=>J[i]);
  const et=l=>l.length>1?l.slice(0,-1).join(', ')+' et '+l[l.length-1]:(l[0]||'?');
  if(+r.tous===2)return js.length===1?`Un ${js[0]} sur deux`:`Une semaine sur deux : ${et(js)}`;
  return `Tous les ${et(js.map(x=>x+'s'))}`;
}
function absenceOf(cid,d,slot){
  for(const a of Object.values(state.absences)){
    if(a.collab!==cid||d<a.du||(a.au&&d>a.au))continue;
    if(a.rec&&!recMatch(a.rec,a.du,d))continue;
    if(a.portion==='journee'||!a.portion||a.portion===slot)return a;
  }
  return null;
}

/* ---------- moteur de rotation ----------
   Chaque jour ouvré, une personne (ou plus, selon le réglage) est « de back office »
   et assure toutes les tâches de la journée. On retient la personne présente toute la
   journée qui a été de back office il y a le plus longtemps, puis la moins souvent,
   puis selon l'ordre de l'équipe. Si personne n'est présent toute la journée, un
   relais matin / après-midi est organisé. Les choix manuels comptent dans l'historique. */
function compute(from,to){
  const R=reglages(),need=Math.max(1,+R.parJour||1);
  let d=monday(R.debut&&R.debut<from?R.debut:from);
  const team=collabs(),ids=new Set(team.map(c=>c.id)),C=Object.fromEntries(team.map(c=>[c.id,c]));
  let queue=team.map(c=>c.id);
  const rebases=Object.entries(state.ordres||{}).map(([k,v])=>({d:v.depuis||k,ordre:(v.ordre||[]).filter(id=>ids.has(id))})).sort((a,b)=>a.d.localeCompare(b.d));
  let ri=0,lastDoers=[];const sub={},out={};
  const toEnd=id=>{queue=queue.filter(x=>x!==id);queue.push(id)};
  for(;d<=to;d=addDays(d,1)){
    let rebased=false;
    while(ri<rebases.length&&rebases[ri].d<=d){const o=rebases[ri].ordre;queue=[...o,...queue.filter(x=>!o.includes(x))];ri++;rebased=true}
    if(weekday(d)>4)continue;
    const fer=R.feries!==false?ferieName(d):'';
    const day={iso:d,ferie:fer,matin:[],apresmidi:[],short:{matin:0,apresmidi:0},manual:false,relais:false,absents:[],present:[],queue:[...queue],subFor:{},swapWith:[],doublure:[],evite:[]};
    if(!fer){
      const absM={},absA={};
      for(const c of team){if(!inRotation(c,d))continue;
        const m=absenceOf(c.id,d,'matin'),a=absenceOf(c.id,d,'apresmidi');
        if(m)absM[c.id]=m;if(a)absA[c.id]=a;
        if(m&&a)day.absents.push({id:c.id,a:m,p:'journee'});else if(m)day.absents.push({id:c.id,a:m,p:'matin'});else if(a)day.absents.push({id:c.id,a,p:'apresmidi'});
        if(!m||!a)day.present.push(c.id)}
      const full=id=>C[id]&&inRotation(C[id],d)&&!enDoublure(C[id],d)&&!absM[id]&&!absA[id];
      // règles souples : jour à éviter, pas deux tours de suite. La personne écartée garde sa place et passe le jour suivant.
      const avoid=id=>(C[id].eviter||[]).includes(weekday(d))||(R.pasDeSuite!==false&&lastDoers.includes(id));
      const holders=()=>{const el=queue.filter(full),ok=el.filter(id=>!avoid(id));const pick=[...ok,...el.filter(avoid)].slice(0,need);day.evite=el.filter(id=>avoid(id)&&!pick.includes(id)&&queue.indexOf(id)<queue.indexOf(pick[pick.length-1]??id));return pick};
      const ov=cellOf(d);
      if(ov){
        day.manual=ov.mode;const sel=ov.ids.filter(id=>ids.has(id));
        day.matin=sel.filter(id=>!absM[id]);day.apresmidi=sel.filter(id=>!absA[id]);
        if(ov.mode==='echange'){
          // les titulaires du tour passent en fin de file et reprendront le prochain tour des remplaçants
          const h=holders();h.forEach(toEnd);
          const xs=sel.filter(x=>!h.includes(x)),as=h.filter(a=>!sel.includes(a));
          xs.forEach((x,i)=>{if(as[i]){sub[x]=as[i];day.swapWith.push(as[i])}});
        } else sel.forEach(toEnd); // décalage : les choisis passent en fin de file, les autres avancent d'un jour
      } else {
        const h=holders(),doers=[];
        for(const x of h){const s=sub[x];
          if(s&&full(s)&&!h.includes(s)&&!doers.includes(s)){doers.push(s);day.subFor[s]=x;delete sub[x]}
          else doers.push(x)}
        h.forEach(toEnd);
        day.matin=[...doers];day.apresmidi=[...doers];
        if(doers.length<need){
          const fill=(slot,abs)=>{const extra=queue.filter(id=>C[id]&&inRotation(C[id],d)&&!enDoublure(C[id],d)&&!abs[id]&&!day[slot].includes(id)).slice(0,need-day[slot].length);if(extra.length){day.relais=true;day[slot].push(...extra);extra.forEach(toEnd)}};
          fill('matin',absM);fill('apresmidi',absA);
        }
      }
      day.short.matin=Math.max(0,need-day.matin.length);day.short.apresmidi=Math.max(0,need-day.apresmidi.length);
      const doers=dutyIds(day);
      day.doublure=team.filter(c=>enDoublure(c,d)&&doers.includes(c.doublure.tuteur)&&!absM[c.id]&&!absA[c.id]).map(c=>c.id);
      lastDoers=doers;
    } else lastDoers=[];
    day.rebased=rebased;
    if(d>=from)out[d]=day;
  }
  return out;
}
function cellOf(d){const c=((state.affectations[monday(d)]||{}).cells||{})[d];if(!c)return null;if(Array.isArray(c))return {ids:c,mode:'decale'};return {ids:c.ids||[],mode:c.mode||'decale'}}
const dutyIds=day=>[...new Set([...day.matin,...day.apresmidi])];

  const pct=total?Math.round(n/total*100):0;

/* ---------- 9. jours à risque (sous-effectif) ---------- */
// Effectif d'un jour = personnes de la rotation présentes (1 par journée, 0,5 par demi-journée), hors doublure.
function effMap(from,to){
  const R=reglages(),seuil=Math.max(1,+R.seuil||2),plan=compute(from,to),team=collabs();
  return Object.values(plan).filter(P=>!P.ferie).map(P=>{
    const inR=team.filter(c=>inRotation(c,P.iso)&&!enDoublure(c,P.iso));
    let eff=0;for(const c of inR){const ab=P.absents.find(x=>x.id===c.id);eff+=ab?(ab.p==='journee'?0:.5):1}
    const level=(P.short.matin||P.short.apresmidi)?'crit':eff<seuil?'warn':null;
    return {d:P.iso,eff,level,absents:P.absents,seuil};
  });
}
const riskDays=(from,to)=>effMap(from,to).filter(r=>r.level);
const fmtN=v=>String(Math.round(v*10)/10).replace('.',',');
function riskPanel(){
  const to=addDays(TODAY,91),list=riskDays(TODAY,to),C=byId(),seuil=Math.max(1,+reglages().seuil||2);

    <span class="stack">${r.absents.map(x=>`<span class="abs ${x.a.type||'autre'}">${esc(initials(C[x.id]?.nom))}${x.p!=='journee'?' ('+SLOTL[x.p].toLowerCase()+')':''}</span>`).join('')}</span></div>`).join('');
  return `<div class="panel" style="margin-bottom:20px"><div class="section-title"><div><h2>Jours à risque</h2><p class="muted" style="font-size:.85rem">Les 3 prochains mois, jours où l'agence compte moins de ${seuil} personne${seuil>1?'s':''} présente${seuil>1?'s':''} ou sans back office. Seuil réglable dans Tâches et réglages.</p></div><span class="pill ${list.length?(list.some(r=>r.level==='crit')?'crit':'warn'):'ok'}">${list.length?`${list.length} jour${list.length>1?'s':''}`:'Aucun'}</span></div>
    ${list.length?`<div class="risks">${rows}</div>${list.length>24?`<p class="muted" style="font-size:.8rem">… et ${list.length-24} autres.</p>`:''}`:'<p class="muted">L\'effectif est suffisant sur toute la période.</p>'}</div>`;
}
// impact d'une absence en cours de saisie, avant de l'enregistrer
function absImpact(){
  const box=$('#a-impact');if(!box)return;
  const v=id=>$('#'+id)?.value;const cid=v('a-collab'),du=v('a-du'),au=v('a-au'),portion=v('a-portion');
  if(!cid||!du||!au||au<du||ordinal(au)-ordinal(du)>200){box.innerHTML='';return}
  const before=new Map(riskDays(du,au).map(r=>[r.d,r]));
  const after=withState({absences:{...state.absences,__apercu:{collab:cid,du,au,type:'autre',portion}}},()=>riskDays(du,au));
  const worse=after.filter(r=>{const b=before.get(r.d);return !b||(b.level!=='crit'&&r.level==='crit')||r.eff<b.eff&&b.level!==r.level});
  box.innerHTML=worse.length?`<div class="impact"><b>Attention :</b> cette absence ferait passer ${worse.length} jour${worse.length>1?'s':''} en sous-effectif : ${worse.slice(0,6).map(r=>`${DN[weekday(r.d)]} ${short(r.d)} (${r.level==='crit'?'sans back office':fmtN(r.eff)+' présent'+(r.eff>1?'s':'')})`).join(', ')}${worse.length>6?'…':''}.</div>`
    :'<div class="impact ok">Aucun jour ne passe en sous-effectif avec cette absence.</div>';
}

/* ---------- 11. indicateurs d'activité ---------- */
function vActivite(){
  if(isEmpty())return emptyState();
  const R=reglages(),ts=taches(),C=byId(),start=monday(R.debut),end=TODAY;
  const P={'4w':[addDays(monday(TODAY),-21),'4 semaines'],'12w':[addDays(monday(TODAY),-77),'12 semaines'],'month':[TODAY.slice(0,8)+'01','Mois en cours'],'all':[start,'Depuis le début']};
  const per=ui.actPeriod&&P[ui.actPeriod]?ui.actPeriod:'12w';let from=P[per][0];if(from<start)from=start;
  const plan=compute(from,end);
  const days=Object.keys(plan).sort().filter(d=>!plan[d].ferie);
  const withVol=days.filter(d=>Object.keys(journal(d).vol||{}).length);
  const complete=days.filter(d=>{const g=progress(d);return g.total&&g.n===g.total}).length;
  const seg=`<div class="seg" role="group" aria-label="Période">${Object.entries(P).map(([k,v])=>`<button data-act="actp" data-v="${k}" aria-pressed="${per===k}">${v[1]}</button>`).join('')}</div>`;
  const head=`<div class="section-title"><div><h2>Activité du back office</h2><p class="muted">Volumes saisis dans le programme du jour, du ${short(from)} à aujourd'hui.</p></div>${seg}</div>`;
  if(!withVol.length)return head+`<div class="empty" style="margin-top:14px"><h3>Pas encore de volumes saisis</h3><p class="muted">Dans le programme du jour (onglet Planning), indiquez pour chaque tâche le nombre traité : mails, alertes, appels… Les indicateurs apparaîtront ici.</p><button class="btn primary" data-tab="planning">Aller au programme du jour</button></div>`;
  const tot={},cnt={};ts.forEach(t=>{tot[t.id]=0;cnt[t.id]=0});
  for(const d of withVol){const v=journal(d).vol;for(const t of ts)if(v[t.id]!=null&&v[t.id]!==''){tot[t.id]+=+v[t.id];cnt[t.id]++}}
  const tiles=`<div class="tiles">
    <div class="tile"><span class="eyebrow">Jours saisis</span><b class="mono">${withVol.length}</b><small>sur ${days.length} jours ouvrés</small></div>
    <div class="tile"><span class="eyebrow">Programme complet</span><b class="mono">${days.length?Math.round(complete/days.length*100):0} %</b><small>${complete} jour${complete>1?'s':''} à 100 %</small></div>
    ${ts.map(t=>`<div class="tile"><span class="eyebrow">${esc(t.nom)}</span><b class="mono">${fmtN(tot[t.id])}</b><small>${cnt[t.id]?`${fmtN(tot[t.id]/cnt[t.id])} par jour en moyenne`:'aucune saisie'}</small></div>`).join('')}</div>`;
  // une petite courbe en barres par tâche : total par semaine
  const weeks=[];for(let m=monday(from);m<=end;m=addDays(m,7))weeks.push(m);
  const charts=ts.map(t=>{
    const data=weeks.map(m=>{let s=0,n=0;for(let i=0;i<5;i++){const d=addDays(m,i);const v=journal(d).vol?.[t.id];if(d>=from&&d<=end&&v!=null&&v!==''){s+=+v;n++}}return {m,s,n}});
    return barChart(t.nom,data);
  }).join('');
  // par collaborateur : moyenne par jour de back office saisi
  const by={};for(const d of withVol){const ids=dutyIds(plan[d]);const v=journal(d).vol;for(const id of ids){by[id]??={n:0,t:{}};by[id].n++;for(const t of ts)if(v[t.id]!=null&&v[t.id]!=='')by[id].t[t.id]=(by[id].t[t.id]||0)+(+v[t.id])/ids.length}}
  const people=Object.keys(by).map(id=>C[id]).filter(Boolean);
  const table=`<div class="grid-wrap" style="margin-top:20px"><table class="eq" style="min-width:560px"><caption class="sr">Moyenne par jour de back office et par collaborateur</caption><thead><tr><th>Collaborateur</th><th>Jours saisis</th>${ts.map(t=>`<th>${esc(t.nom)} / jour</th>`).join('')}</tr></thead>
    <tbody>${people.map(c=>`<tr><td>${chip(c)}</td><td class="num">${by[c.id].n}</td>${ts.map(t=>`<td class="num">${by[c.id].t[t.id]!=null?fmtN(by[c.id].t[t.id]/by[c.id].n):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return head+tiles+`<h3 style="margin:22px 0 10px">Volume par semaine</h3><div class="charts">${charts}</div>`+table+
    `<p class="muted" style="font-size:.82rem;margin-top:10px">Les moyennes ne comptent que les jours où un volume a été saisi. Un jour en relais est réparti entre les deux personnes.</p>`;
}
function barChart(title,data){
  const W=320,H=150,pl=34,pr=8,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(1,...data.map(x=>x.s));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=[1,2,2.5,5,10].map(k=>k*step).find(v=>v*4>=max)||step*10;
  const top=Math.ceil(max/nice)*nice,ticks=[];for(let v=0;v<=top+1e-9;v+=nice)ticks.push(v);
  const y=v=>pt+ih-(v/top)*ih,bw=Math.max(4,iw/data.length-2);
  const every=Math.ceil(data.length/6);
  const bars=data.map((x,i)=>{const X=pl+i*(iw/data.length)+1,h=Math.max(0,ih-(y(x.s)-pt)),Y=y(x.s);const r=Math.min(4,bw/2,h);
    const path=h>0?`M${X},${pt+ih}V${Y+r}Q${X},${Y} ${X+r},${Y}H${X+bw-r}Q${X+bw},${Y} ${X+bw},${Y+r}V${pt+ih}Z`:'';
    const tip=`Semaine ${isoWeek(x.m)} (${short(x.m)}) · ${fmtN(x.s)} ${title.toLowerCase()}${x.n?` · ${fmtN(x.s/x.n)} par jour (${x.n} j saisi${x.n>1?'s':''})`:' · aucune saisie'}`;
    return `<g class="bar" tabindex="0" data-tip="${esc(tip)}"><rect x="${X-1}" y="${pt}" width="${bw+2}" height="${ih}" fill="transparent"/>${path?`<path d="${path}" fill="var(--accent)"/>`:''}</g>`+(i%every===0?`<text x="${X+bw/2}" y="${H-6}" text-anchor="middle" class="ax">S${isoWeek(x.m)}</text>`:'')}).join('');
  const grid=ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" class="ax">${fmtN(v)}</text>`).join('');
  const total=data.reduce((a,x)=>a+x.s,0);
  return `<figure class="chart"><figcaption><b>${esc(title)}</b><span class="muted mono">${fmtN(total)} au total</span></figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} par semaine">${grid}${bars}</svg></figure>`;
}
// infobulle des graphiques
(function(){let tip=null;
  const show=(g,x,y)=>{if(!tip){tip=document.createElement('div');tip.className='tip';tip.setAttribute('role','tooltip');document.body.appendChild(tip)}tip.textContent=g.dataset.tip;tip.hidden=false;
    const r=tip.getBoundingClientRect();tip.style.left=Math.min(window.innerWidth-r.width-8,Math.max(8,x-r.width/2))+'px';tip.style.top=Math.max(8,y-r.height-12)+'px'};
  const hide=()=>{if(tip)tip.hidden=true};
  document.addEventListener('mouseover',e=>{const g=e.target.closest&&e.target.closest('.bar');if(g)show(g,e.clientX,e.clientY);else hide()});
  document.addEventListener('mousemove',e=>{const g=e.target.closest&&e.target.closest('.bar');if(g)show(g,e.clientX,e.clientY)});
  document.addEventListener('focusin',e=>{const g=e.target.closest&&e.target.closest('.bar');if(g){const r=g.getBoundingClientRect();show(g,r.left+r.width/2,r.top)}});
  document.addEventListener('focusout',hide);
  document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('.bar');if(g){const r=g.getBoundingClientRect();show(g,r.left+r.width/2,r.top)}else hide()});
})();

function scrollActiveTab(){const t=$('#tabs'),a=t&&t.querySelector('[aria-selected="true"]');if(!a)return;const l=a.offsetLeft-(t.clientWidth-a.offsetWidth)/2;t.scrollLeft=Math.max(0,l)}

(function(){let x0=null,y0=null,t0=0;

  document.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-t0<600&&ui.tab==='planning'){ui.week=addDays(ui.week,dx<0?7:-7);render();toast(`Semaine ${isoWeek(ui.week)}`)}},{passive:true});
})();

function renderHero(){

  const card=(d,lbl,cls)=>{const P=plan[d];if(!P)return '';const ids=dutyIds(P);
    const names=ids.map(id=>C[id]).filter(Boolean);
    return `<div class="today-card ${cls}"><span class="lbl">${lbl}</span>${names.length?names.map(c=>`<span class="who"><span class="av">${esc(initials(c.nom))}</span>${esc(c.nom)}</span>`).join(''):'<span class="who">Personne de disponible</span>'}<span class="sub">${P.relais?'Relais matin / après-midi':'Toute la journée'}${d===TODAY?(()=>{const g=progress(d);return g.total?` · ${g.n}/${g.total} tâches faites`:''})():''}</span></div>`};

function isEmpty(){return !Object.keys(state.equipe).length&&!Object.keys(state.taches).length}
function emptyState(){
  if(mode==='init')return `<div class="empty"><p class="muted">Chargement du planning…</p></div>`;
  return `<div class="empty"><h2>Aucune équipe enregistrée</h2><p class="muted">Créez l'équipe type (4 collaborateurs, 1 poste à pourvoir et les tâches du back office), puis renommez chacun dans l'onglet Équipe.</p>${canWrite?'<button class="btn primary" data-act="seed">Créer l\'équipe type</button>':''}</div>`;
}

function weekDays(m){return [0,1,2,3,4].map(i=>addDays(m,i))}
const slotTasks=(ts,s)=>ts.filter(t=>t.creneau===s);

function vPlanning(){
  if(isEmpty())return emptyState();
  const m=ui.week,days=weekDays(m),plan=compute(m,addDays(m,4)),C=byId(),ts=taches();
  let shortN=0,relais=0;const absSet=new Set(),ferL=[];
  for(const d of days){const P=plan[d];if(P.ferie)ferL.push(`${DN[weekday(d)]} ${short(d)}`);shortN+=P.short.matin+P.short.apresmidi;if(P.relais)relais++;P.absents.forEach(x=>absSet.add(x.id))}
  const rot=collabs().filter(c=>days.some(d=>inRotation(c,d))).length;
  const pills=[`<span class="pill ok"><b>${rot}</b> dans la rotation</span>`,
    absSet.size?`<span class="pill info"><b>${absSet.size}</b> absent${absSet.size>1?'s':''} dans la semaine</span>`:`<span class="pill">Aucune absence</span>`,
    shortN?`<span class="pill crit"><b>${shortN}</b> demi-journée${shortN>1?'s':''} sans back office</span>`:`<span class="pill ok">Back office assuré toute la semaine</span>`,
    relais?`<span class="pill warn"><b>${relais}</b> jour${relais>1?'s':''} en relais</span>`:'',
    ...ferL.map(f=>`<span class="pill warn">Férié · ${f}</span>`),
    (()=>{const r=riskDays(TODAY,addDays(TODAY,91));return r.length?`<button class="pill ${r.some(x=>x.level==='crit')?'crit':'warn'} pill-btn" data-tab="absences">${r.length} jour${r.length>1?'s':''} à risque sur 3 mois →</button>`:''})()].join('');
  const head=`<div class="toolbar">
    <div class="weeknav"><button class="icon-btn" data-act="wk" data-n="-7" aria-label="Semaine précédente">‹</button>
      <div class="weeklabel"><span class="eyebrow">Semaine ${isoWeek(m)}</span><b>${longd(m)} – ${longd(addDays(m,4))} ${parse(m).getFullYear()}</b></div>
      <button class="icon-btn" data-act="wk" data-n="7" aria-label="Semaine suivante">›</button>
      ${m!==CUR()?'<button class="btn ghost" data-act="wk0">Cette semaine</button>':''}</div>
    <div class="row"><div class="seg" role="group" aria-label="Affichage"><button data-act="view" data-v="poste" aria-pressed="${ui.view==='poste'}">Par jour</button><button data-act="view" data-v="collab" aria-pressed="${ui.view==='collab'}">Par collaborateur</button></div>
    <button class="btn" data-act="copy" aria-label="Copier la semaine">${narrow()?'Copier':'Copier la semaine'}</button></div></div>
    <div class="summary">${pills}</div>`;

  return head+(todayCard?`<div style="margin-top:14px">${todayCard}</div>`:'')+(narrow()?(ui.view==='collab'?collabCards(days,plan,C):dayCards(days,plan,C,ts)):(ui.view==='collab'?gridCollab(days,plan,C):gridJour(days,plan,C,ts)))+orderPanel()+
    `<p class="muted" style="font-size:.82rem;margin-top:10px">${canWrite?'Cliquez la case « De back office » d\'un jour pour échanger un tour ou faire passer quelqu\'un en priorité ; les conséquences sur les autres jours s\'affichent avant d\'enregistrer.':'Lecture seule.'} Les absences se saisissent dans l'onglet Absences.</p>`;
}

function dayHead(days,plan){return days.map(d=>{const P=plan[d];return `<th class="${d===TODAY?'today':''}"><div class="dhead"><span class="dname">${DN[weekday(d)]}</span><span class="dnum">${short(d)}</span></div>${P.ferie?`<span class="ftag">${esc(P.ferie)}</span>`:''}</th>`}).join('')}
const td=(d,inner,cls='')=>`<td class="${cls} ${d===TODAY?'today':''}">${inner}</td>`;

const narrow=()=>!!(typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(max-width: 700px)').matches);
function dayCards(days,plan,C,ts){
  const prog=SLOTS.map(sl=>{const l=slotTasks(ts,sl.id).map(t=>esc(t.nom));return l.length?`<span><em>${sl.label}</em>${l.join(' · ')}</span>`:''}).join('');
  return `<div class="daylist swipe" style="margin-top:14px">${days.map(d=>{const P=plan[d];
    const head=`<header><b>${DNL[weekday(d)]}</b><span class="mono muted">${short(d)}</span>${d===TODAY?'<span class="pill ok">Aujourd\'hui</span>':''}</header>`;

function collabCards(days,plan,C){

    if(P.ferie||!inRotation(c,d)){st='—';cls='off'}else{const ab=P.absents.find(x=>x.id===c.id),bo=dutyIds(P).includes(c.id);st=bo?'Back office':ab?(ABS[ab.a.type]||'Absent'):'Agence';cls=bo?'bo-day':ab?'abs-day':''}

function dutyButton(d,P,C){

  const ch=ids.map(id=>{const half=!P.matin.includes(id)?' (ap.-midi)':!P.apresmidi.includes(id)?' (matin)':'';return chip(C[id],'big')+(half?`<span class="muted" style="font-size:.74rem">${half.trim()}</span>`:'')}).join('');
  return `<button class="cell duty-cell ${sh?'short':''}" data-act="cell" data-d="${d}" ${canWrite?'':'disabled'} aria-label="Back office du ${DNL[weekday(d)]} ${short(d)}">${ch||'<span class="muted">Personne</span>'}${sh?`<span class="flag crit">${P.short.matin&&P.short.apresmidi?'Non couvert':P.short.matin?'Matin non couvert':'Ap.-midi non couvert'}</span>`:''}${P.doublure.map(id=>`<span class="flag man">+ ${esc(C[id]?.nom)} en doublure</span>`).join('')}${P.evite.length?`<span class="flag-txt" title="Écarté ce jour-là (jour à éviter ou tour la veille)">${esc(P.evite.map(id=>initials(C[id]?.nom)).join(', '))} décalé</span>`:''}${P.relais?'<span class="flag warn">Relais</span>':''}${d<=TODAY&&ids.length?(()=>{const g=progress(d);return g.total?`<span class="flag ${g.n===g.total?'ok':d<TODAY?'crit':'warn'}">✓ ${g.n}/${g.total}</span>`:''})():''}${P.manual==='echange'||Object.keys(P.subFor).length?'<span class="flag man">Échange</span>':P.manual?'<span class="flag man">Avancé</span>':''}</button>`;
}
function gridJour(days,plan,C,ts){
  let body=`<tr><th class="task">De back office<span class="tmeta">Assure toutes les tâches de la journée</span></th>`;

    const P=plan[d];
    if(P.ferie){body+=`<td class="off"></td>`;continue}
    body+=td(d,dutyButton(d,P,C));
  }
  body+='</tr>';
  for(const sl of SLOTS){
    const mine=slotTasks(ts,sl.id);if(!mine.length)continue;
    body+=`<tr class="slot"><th colspan="6">${sl.label}</th></tr>`;
    for(const t of mine){
      body+=`<tr class="sub"><th>${esc(t.nom)}${t.desc?`<span class="tmeta">${esc(t.desc)}</span>`:''}</th>`;
      for(const d of days){const P=plan[d];if(P.ferie){body+='<td class="off"></td>';continue}
        body+=td(d,`<div class="stack">${P[sl.id].map(id=>chip(C[id],'sm')).join('')||'<span class="flag-txt">—</span>'}</div>`)}
      body+='</tr>';
    }
  }
  body+=`<tr class="slot"><th colspan="6">Absences</th></tr><tr class="sub"><th>Absents</th>${days.map(d=>{const P=plan[d];if(P.ferie)return '<td class="off"></td>';
    return td(d,`<div class="stack">${P.absents.map(x=>`<span class="abs ${x.a.type||'autre'}">${esc(initials(C[x.id]?.nom))} · ${ABS[x.a.type]||'Absent'}${x.p!=='journee'?' ('+SLOTL[x.p].toLowerCase()+')':''}</span>`).join('')||'<span class="muted" style="font-size:.78rem">—</span>'}</div>`)}).join('')}</tr>`;
  return `<div class="grid-wrap" style="margin-top:14px"><table class="plan"><thead><tr><th class="corner"><span class="eyebrow">Programme</span></th>${dayHead(days,plan)}</tr></thead><tbody>${body}</tbody></table></div>`;

function gridCollab(days,plan,C){
  const team=collabs().filter(c=>days.some(d=>inRotation(c,d)));
  if(!team.length)return '<div class="empty" style="margin-top:14px"><p class="muted">Personne dans la rotation cette semaine.</p></div>';
  const rows=team.map(c=>`<tr><th>${chip(c)}</th>${days.map(d=>{const P=plan[d];
    if(P.ferie||!inRotation(c,d))return '<td class="off"></td>';
    const ab=P.absents.find(x=>x.id===c.id),m=P.matin.includes(c.id),a=P.apresmidi.includes(c.id);
    const bits=[];
    if(m&&a)bits.push('<span class="bo">Back office</span>');else if(m)bits.push('<span class="bo">Back office · matin</span>');else if(a)bits.push('<span class="bo">Back office · ap.-midi</span>');

    return td(d,`<div class="stack">${bits.join('')}</div>`)}).join('')}</tr>`).join('');
  return `<div class="grid-wrap" style="margin-top:14px"><table class="people"><thead><tr><th><span class="eyebrow">Collaborateur</span></th>${dayHead(days,plan)}</tr></thead><tbody>${rows}</tbody></table></div>`;

/* ---------- saisie groupée : lecture d'une liste collée ---------- */
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function parseDateFr(s){
  s=s.trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)){const dt=new Date(+m[1],m[2]-1,+m[3]);return dt.getMonth()===m[2]-1?iso(dt):null}
  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/)){
    const d=+m[1],mo=+m[2];let y=m[3]?+m[3]:null;if(y!==null&&y<100)y+=2000;
    if(y===null){y=+TODAY.slice(0,4);if(iso(new Date(y,mo-1,d))<addDays(TODAY,-60))y++}
    const dt=new Date(y,mo-1,d);return dt.getMonth()===mo-1&&dt.getDate()===d?iso(dt):null}
  return null;
}
function typeOf(s){const n=norm(s);if(!n)return null;
  if(/^(conge|conges|cp|vacances|ca)\b/.test(n))return 'conge';if(/^rtt/.test(n))return 'rtt';
  if(/^(maladie|arret|am)\b/.test(n))return 'maladie';if(/^(temps partiel|tp)\b/.test(n))return 'tempspartiel';if(/^formation/.test(n))return 'formation';if(/^autre/.test(n))return 'autre';return null}
function portionOf(s){const n=norm(s);if(/^(matin|am|mat)$/.test(n))return 'matin';if(/^(apres-midi|apres midi|aprem|ap-midi|apm|pm)$/.test(n))return 'apresmidi';if(/^(journee|jour|journees)$/.test(n))return 'journee';return null}
function matchCollab(q){
  const n=norm(q),team=collabs();if(!n)return {err:'Nom manquant'};
  let f=team.filter(c=>norm(c.nom)===n);
  if(!f.length)f=team.filter(c=>norm(c.nom).startsWith(n)||norm(c.nom).split(' ').includes(n));
  if(!f.length)f=team.filter(c=>initials(c.nom)===q.trim().toUpperCase());
  if(f.length===1)return {c:f[0]};
  return {err:f.length?`« ${q} » correspond à plusieurs personnes`:`« ${q} » ne correspond à personne de l'équipe`};
}
function parseBulk(text){
  return text.split(/\r?\n/).map((raw,i)=>({raw,i:i+1})).filter(l=>l.raw.trim()&&!/^#/.test(l.raw.trim())).map(({raw,i})=>{
    let parts=raw.split(/\t|;/).map(s=>s.trim()).filter(Boolean);
    if(parts.length<2)parts=raw.split(',').map(s=>s.trim()).filter(Boolean);
    if(parts.length<2){const m=raw.match(/^(.*?)\s+(\d.*)$/);if(m)parts=[m[1],...m[2].split(/\s+(?:au|à|-)\s+|\s+/)].filter(Boolean)}
    const r={line:i,raw};const mc=matchCollab(parts[0]||'');if(mc.err){r.err=mc.err;return r}
    r.collab=mc.c.id;const dates=[],notes=[];
    for(const p of parts.slice(1)){const d=parseDateFr(p);if(d){dates.push(d);continue}
      const t=typeOf(p);if(t&&!r.type){r.type=t;continue}const po=portionOf(p);if(po&&!r.portion){r.portion=po;continue}notes.push(p)}
    if(!dates.length){r.err='Date absente ou illisible (format attendu : 12/10/2026)';return r}
    r.du=dates[0];r.au=dates[1]||dates[0];r.type=r.type||'conge';r.portion=r.portion||'journee';r.note=notes.join(' ');
    if(r.au<r.du){r.err='La date de fin précède la date de début';return r}
    if(r.au<TODAY)r.warn='Absence déjà passée';
    const dup=Object.values(state.absences).some(a=>!a.rec&&a.collab===r.collab&&a.du===r.du&&a.au===r.au&&(a.portion||'journee')===r.portion);
    if(dup){r.dup=true;r.warn='Déjà enregistrée, sera ignorée';return r}
    const over=Object.values(state.absences).some(a=>!a.rec&&a.collab===r.collab&&a.du<=r.au&&a.au>=r.du);
    if(over)r.warn='Chevauche une absence déjà saisie';
    return r;
  });
}
function bulkPreview(){
  const rows=parseBulk(ui.bulkText||''),C=byId();
  if(!rows.length)return '<p class="muted" style="font-size:.85rem">L\'aperçu des lignes reconnues s\'affichera ici.</p>';
  const ok=rows.filter(r=>!r.err&&!r.dup).length;
  return `<div class="bulk-list">${rows.map(r=>`<div class="bulk-row ${r.err?'bad':r.dup?'skip':''}"><span class="mono muted">${r.line}</span>${r.err?`<span>${esc(r.raw)}</span><span class="pill crit">${esc(r.err)}</span>`:`<span class="row" style="gap:6px">${chip(C[r.collab],'sm')}<span class="mono" style="font-size:.84rem">${r.du===r.au?short(r.du):short(r.du)+' → '+short(r.au)}</span><span class="abs ${r.type}">${ABS[r.type]}</span>${r.portion!=='journee'?`<span class="pill">${PORT[r.portion]}</span>`:''}${r.note?`<span class="muted" style="font-size:.8rem">${esc(r.note)}</span>`:''}</span>${r.warn?`<span class="pill warn">${esc(r.warn)}</span>`:'<span class="pill ok">Prête</span>'}`}</div>`).join('')}</div>
    <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:.85rem">${ok} absence${ok>1?'s':''} à enregistrer${rows.length-ok?` · ${rows.length-ok} ligne${rows.length-ok>1?'s':''} ignorée${rows.length-ok>1?'s':''}`:''}</span>
    <button class="btn primary" type="button" data-act="bulksave" ${ok&&canWrite?'':'disabled'}>Enregistrer ${ok||''} absence${ok>1?'s':''}</button></div>`;
}

/* ---------- calendrier des absences ---------- */
function absCalendar(){
  const C=collabs().filter(c=>c.actif||Object.values(state.absences).some(a=>a.collab===c.id));
  const start=ui.calStart||TODAY.slice(0,8)+'01';
  const d0=parse(start),end=iso(new Date(d0.getFullYear(),d0.getMonth()+3,0));
  const days=[];for(let d=start;d<=end;d=addDays(d,1))if(weekday(d)<5)days.push(d);
  const R=reglages();
  const months=[];for(const d of days){const k=d.slice(0,7);const l=months[months.length-1];if(l&&l.k===k)l.n++;else months.push({k,n:1,label:`${MOIS[+d.slice(5,7)-1]} ${d.slice(0,4)}`})}
  const cell=(c,d)=>{
    if(R.feries!==false&&ferieName(d))return `<td class="cal-f" title="${esc(ferieName(d))}"></td>`;
    const m=absenceOf(c.id,d,'matin'),a=absenceOf(c.id,d,'apresmidi');
    if(!m&&!a)return `<td class="${d===TODAY?'cal-t':''} ${weekday(d)===0?'cal-w':''}"></td>`;
    const tm=m?.type||'autre',ta=a?.type||'autre';
    const bg=m&&a?`var(--k-${tm})`:m?`linear-gradient(to bottom,var(--k-${tm}) 50%,transparent 50%)`:`linear-gradient(to bottom,transparent 50%,var(--k-${ta}) 50%)`;
    const lab=`${c.nom} · ${DNL[weekday(d)]} ${short(d)} · ${m&&a?ABS[tm]:m?ABS[tm]+' (matin)':ABS[ta]+' (après-midi)'}`;
    return `<td class="${d===TODAY?'cal-t':''} ${weekday(d)===0?'cal-w':''}" title="${esc(lab)}"><i style="background:${bg}"></i></td>`};
  return `<div class="panel" style="margin-top:20px"><div class="section-title"><div><h2>Calendrier des absences</h2><p class="muted" style="font-size:.85rem">Jours ouvrés sur 3 mois. Une demi-case correspond à une demi-journée.</p></div>
    <div class="row"><button class="icon-btn" data-act="cal" data-n="-1" aria-label="Mois précédent">‹</button><button class="btn ghost" data-act="cal0">Aujourd'hui</button><button class="icon-btn" data-act="cal" data-n="1" aria-label="Mois suivant">›</button></div></div>
    <div class="grid-wrap" style="border:0"><table class="cal"><thead><tr><th></th>${months.map(m=>`<th colspan="${m.n}" class="cal-m">${m.label}</th>`).join('')}</tr>
    <tr><th></th>${days.map(d=>`<th class="cal-d ${weekday(d)===0?'cal-w':''} ${d===TODAY?'cal-t':''}">${+d.slice(8)}</th>`).join('')}</tr></thead>
    <tbody>${C.map(c=>`<tr><th class="cal-n">${chip(c,'sm')}</th>${days.map(d=>cell(c,d)).join('')}</tr>`).join('')}
    ${(()=>{const em=Object.fromEntries(effMap(days[0],days[days.length-1]).map(r=>[r.d,r]));return `<tr class="cal-eff"><th class="cal-n"><span class="muted" style="font-size:.78rem;font-weight:600">Présents</span></th>${days.map(d=>{const r=em[d];if(!r)return '<td class="cal-f"></td>';return `<td class="ce ${r.level||''}" title="${DNL[weekday(d)]} ${short(d)} · ${fmtN(r.eff)} présent${r.eff>1?'s':''}">${(Math.floor(r.eff)||(r.eff%1?'':'0'))+(r.eff%1?'½':'')}</td>`}).join('')}</tr>`})()}</tbody></table></div>
    <div class="row" style="gap:12px;font-size:.8rem">${['conge','rtt','maladie','formation','tempspartiel','autre'].map(k=>`<span class="row" style="gap:5px"><i class="key" style="background:var(--k-${k})"></i>${ABS[k]}</span>`).join('')}<span class="row" style="gap:5px"><i class="key cal-f"></i>Férié</span></div></div>`;
}

      <button class="btn danger" data-act="dela" data-id="${a.id}" ${dis}>Supprimer</button></div>`};
  const single=`<form class="panel" id="absform"><label class="f"><span>Collaborateur</span><select id="a-collab" required ${dis}>${team.map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join('')}</select></label>

      <div class="row"><label class="f grow"><span>Motif</span><select id="a-type" ${dis}>${Object.entries(ABS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>

      <label class="f"><span>Note (optionnel)</span><input type="text" id="a-note" placeholder="ex. retour prévu lundi" ${dis}></label>
      <div id="a-impact"></div>
      <div id="a-err" style="color:var(--crit);font-size:.85rem"></div>
      <div><button class="btn primary" type="submit" ${dis}>Ajouter l'absence</button></div>

  const rf=ui.recForm||{freq:'hebdo',tous:'1',jours:[2],rang:'1',jour:'0'};
  const recurring=`<form class="panel" id="recform"><label class="f"><span>Collaborateur</span><select id="r-collab" required ${dis}>${team.map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join('')}</select></label>

      ${rf.freq==='mensuel'?`<div class="row"><label class="f grow"><span>Le</span><select id="r-rang" ${dis}>${Object.entries(RANG).map(([k,v])=>`<option value="${k}" ${rf.rang==k?'selected':''}>${v}</option>`).join('')}</select></label>

function vEquite(){
  if(isEmpty())return emptyState();
  const R=reglages(),team=collabs();
  const end=addDays(CUR(),4),start=monday(R.debut);
  const P={'4w':[addDays(CUR(),-21),end,'4 dernières semaines'],'month':[TODAY.slice(0,8)+'01',end,'Mois en cours'],'all':[start,end,'Depuis le début']};
  let [from,to]=P[ui.eqPeriod]||P['4w'];if(from<start)from=start;
  const plan=compute(from,to);
  const st={};team.forEach(c=>st[c.id]={bo:0,pres:0,abs:0});
  for(const day of Object.values(plan)){if(day.ferie)continue;
    for(const id of day.matin)st[id]&&(st[id].bo+=.5);for(const id of day.apresmidi)st[id]&&(st[id].bo+=.5);
    for(const c of team)if(inRotation(c,day.iso)){const ab=day.absents.find(x=>x.id===c.id);if(ab){st[c.id].abs+=ab.p==='journee'?1:.5;st[c.id].pres+=ab.p==='journee'?0:.5}else st[c.id].pres+=1}}
  const rows=team.filter(c=>st[c.id].pres||st[c.id].abs);
  const mx=Math.max(1,...rows.map(c=>st[c.id].bo));
  const fmt=v=>String(v).replace('.',',');
  const totalBo=rows.reduce((s,c)=>s+st[c.id].bo,0),totalPres=rows.reduce((s,c)=>s+st[c.id].pres,0);
  return `<div class="section-title"><div><h2>Répartition du back office</h2><p class="muted">Jours de back office par personne, semaine en cours incluse. Une demi-journée de relais compte pour 0,5.</p></div>
    <div class="seg" role="group" aria-label="Période">${Object.entries(P).map(([k,v])=>`<button data-act="eqp" data-v="${k}" aria-pressed="${ui.eqPeriod===k}">${v[2]}</button>`).join('')}</div></div>
    <div class="grid-wrap" style="margin-top:14px"><table class="eq" style="min-width:600px"><thead><tr><th>Collaborateur</th><th>Jours de back office</th><th>Jours présents</th><th>Part attendue</th><th>Absences (j)</th></tr></thead>
    <tbody>${rows.map(c=>{const s=st[c.id],exp=totalPres?totalBo*s.pres/totalPres:0,gap=s.bo-exp;
      return `<tr><td>${chip(c)}</td><td class="num"><div class="bar"><span style="min-width:3ch">${fmt(s.bo)}</span><i style="width:${Math.round(s.bo/mx*90)}px"></i></div></td><td class="num">${fmt(s.pres)}</td><td class="num">${fmt(Math.round(exp*10)/10)} ${Math.abs(gap)>=1?`<span class="pill ${gap>0?'warn':'info'}" style="margin-left:6px">${gap>0?'+':''}${fmt(Math.round(gap*10)/10)}</span>`:''}</td><td class="num">${fmt(s.abs)}</td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Aucune donnée sur cette période.</td></tr>'}</tbody></table></div>
    <p class="muted" style="font-size:.82rem;margin-top:10px">La part attendue tient compte des jours de présence. Un écart d'un jour ou plus vient en général d'une absence ou d'un choix manuel ; la rotation le rattrape d'elle-même.</p>`;
}

/* ---------- ordre de passage ---------- */
function withState(patch,fn){const saved={};for(const k in patch){saved[k]=state[k];state[k]=patch[k]}try{return fn()}finally{Object.assign(state,saved)}}
function nextWorkday(F){for(let i=0;i<40&&(weekday(F)>4||(reglages().feries!==false&&ferieName(F)));i++)F=addDays(F,1);return F}
function orderFrom(){return nextWorkday(ui.week>TODAY?ui.week:TODAY)}
function draftOrdres(list,from){return {...state.ordres,['__draft']:{depuis:from,ordre:list}}}
function orderPanel(){
  const F=orderFrom(),C=byId(),to=addDays(F,62);
  const plan=compute(F,to);
  const base=(plan[F]?.queue||[]).filter(id=>C[id]&&C[id].actif&&(!C[id].fin||C[id].fin>=F));
  const dr=ui.orderDraft&&ui.orderDraft.from===F?ui.orderDraft:null;
  const list=dr?dr.ids:base,dirty=dr&&dr.ids.join()!==base.join();
  const applyFrom=dr?.applyFrom||F;
  const p2=dirty?withState({ordres:draftOrdres(list,applyFrom)},()=>compute(F,to)):plan;
  const nxt={},prev={};
  for(const d of Object.keys(p2).sort()){if(p2[d].ferie)continue;for(const id of dutyIds(p2[d]))if(!nxt[id])nxt[id]=d}
  if(dirty)for(const d of Object.keys(plan).sort()){if(plan[d].ferie)continue;for(const id of dutyIds(plan[d]))if(!prev[id])prev[id]=d}
  const fmt=d=>d?(d===TODAY?'Aujourd\'hui':`${DN[weekday(d)]} ${short(d)}`):'—';
  const dis=canWrite?'':'disabled';
  const rows=list.map((id,i)=>{const c=C[id];const ab=absenceOf(id,F,'matin')||absenceOf(id,F,'apresmidi');
    const note=c.debut&&c.debut>F?`<span class="pill">Arrive le ${short(c.debut)}</span>`:ab?`<span class="abs ${ab.type||'autre'}">${ABS[ab.type]||'Absent'}</span>`:'';
    const changed=dirty&&prev[id]!==nxt[id];
    return `<li class="ord ${changed?'chg':''}"><span class="mono ord-n">${i+1}</span>${chip(c)}${note}<span class="ord-d mono">${changed?`<s>${fmt(prev[id])}</s> `:''}${fmt(nxt[id])}</span>
      <span class="ord-b"><button class="icon-btn" data-act="oup" data-i="${i}" aria-label="Avancer ${esc(c.nom)}" ${i===0?'disabled':''} ${dis}>↑</button><button class="icon-btn" data-act="odown" data-i="${i}" aria-label="Reculer ${esc(c.nom)}" ${i===list.length-1?'disabled':''} ${dis}>↓</button></span></li>`}).join('');
  return `<div class="panel" style="margin-top:20px"><div class="section-title"><div><h3>Ordre de passage</h3><p class="muted" style="font-size:.84rem">File d'attente au ${DNL[weekday(F)].toLowerCase()} ${short(F)} et prochain tour de chacun. ${canWrite?'Modifiez l\'ordre avec les flèches : tous les jours suivants se recalculent.':''}</p></div></div>
    <ol class="ords">${rows||'<li class="muted">Personne dans la rotation.</li>'}</ol>
    ${dirty?`<div class="row ord-apply"><label class="f"><span>Appliquer le nouvel ordre à partir du</span><input type="date" id="ord-from" value="${applyFrom}" min="${TODAY}"></label>
      <div class="row"><button class="btn" data-act="ocancel">Annuler</button><button class="btn primary" data-act="oapply">Appliquer cet ordre</button></div></div>
      <p class="muted" style="font-size:.8rem">Les dates barrées sont les tours actuels, à côté les nouveaux. Les jours déjà passés ne changent pas.</p>`:''}
  </div>`;
}

/* ---------- modale : changer la personne d'un jour ---------- */
function openCell(d){
  const C=collabs().filter(c=>inRotation(c,d)),P=compute(d,d)[d];
  const without=()=>{const m=monday(d),doc=state.affectations[m]||{cells:{}},cells={...doc.cells};delete cells[d];return {...state.affectations,[m]:{cells}}};
  const P0=withState({affectations:without()},()=>compute(d,d)[d]);
  const tit=dutyIds(P0),cur=dutyIds(P),need=Math.max(1,+reglages().parJour||1),typ=need>1?'checkbox':'radio';
  const ov=cellOf(d),mode=ov?.mode||'echange',nm=id=>byId()[id]?.nom||'?';
  const opts=C.map(c=>{const ab=P.absents.find(x=>x.id===c.id);const full=ab&&ab.p==='journee';
    const note=full?`Absent · ${ABS[ab.a.type]||''}`:ab?`Absent ${ab.p==='matin'?'le matin':'l\'après-midi'}`:tit.includes(c.id)?'Tour prévu':'Présent';
    return `<label class="opt ${full?'dis':''}"><input type="${typ}" name="who" value="${c.id}" ${cur.includes(c.id)?'checked':''} ${full?'disabled':''}>${chip(c)}<small>${note}</small></label>`}).join('');
  $('#layer').innerHTML=`<div class="overlay" data-act="close"><form class="modal" id="cellform" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div><div class="eyebrow">${DNL[weekday(d)]} ${short(d)}</div><h3 id="mt">Qui est de back office ?</h3><p class="muted" style="font-size:.85rem">Tour prévu par la rotation : <b>${esc(tit.map(nm).join(', ')||'personne')}</b></p></div>
    <div class="list" style="gap:6px">${opts||'<p class="muted">Personne dans la rotation ce jour-là.</p>'}</div>
    <fieldset class="modes"><legend class="eyebrow">Effet sur les autres jours</legend>
      <label class="opt"><input type="radio" name="mode" value="echange" ${mode==='echange'?'checked':''}><span><b>Échanger les tours</b><br><small class="muted">La personne prévue reprend le prochain tour de la personne choisie. Les autres ne bougent pas.</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="decale" ${mode==='decale'?'checked':''}><span><b>Avancer et décaler la suite</b><br><small class="muted">La personne choisie passe ce jour-là, la personne prévue et les suivants passent chacun un jour plus tard.</small></span></label>
    </fieldset>
    <div id="conseq" class="conseq"></div>
    <div class="row" style="justify-content:space-between"><button type="button" class="btn ghost" data-act="reset" ${ov?'':'disabled'}>Revenir à l'automatique</button>
      <div class="row"><button type="button" class="btn" data-act="close">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></div></form></div>`;
  const f=$('#cellform');
  const read=()=>({ids:[...f.querySelectorAll('input[name=who]:checked')].map(i=>i.value),mode:f.querySelector('input[name=mode]:checked')?.value||'echange'});
  const show=()=>{const {ids,mode}=read();$('#conseq').innerHTML=consequences(d,ids,mode,tit)};
  f.addEventListener('change',show);show();
  f.addEventListener('submit',e=>{e.preventDefault();const {ids,mode}=read();if(ids.join()===tit.join()&&!ov){closeModal();return}setOverride(d,ids.join()===tit.join()?null:ids,mode);closeModal()});
  f.querySelector('[data-act="reset"]').addEventListener('click',()=>{setOverride(d,null);closeModal()});
  (f.querySelector('input:not([disabled])')||f.querySelector('button')).focus();
}
function consequences(d,ids,mode,tit){
  if(!ids.length)return '<p class="muted" style="font-size:.84rem">Choisissez une personne.</p>';
  const to=addDays(d,27),m=monday(d),doc=state.affectations[m]||{cells:{}};
  const cells={...doc.cells};if(ids.join()===tit.join())delete cells[d];else cells[d]={ids,mode};
  const now=withState({affectations:(()=>{const c={...doc.cells};delete c[d];return {...state.affectations,[m]:{cells:c}}})()},()=>compute(d,to));
  const hyp=withState({affectations:{...state.affectations,[m]:{cells}}},()=>compute(d,to));
  const C=byId(),nm=a=>a.map(id=>C[id]?.nom||'?').join(', ')||'personne';
  const ch=Object.keys(hyp).sort().filter(x=>!hyp[x].ferie&&dutyIds(hyp[x]).join()!==dutyIds(now[x]).join());
  if(!ch.length)return '<p class="muted" style="font-size:.84rem">Aucun changement par rapport à la rotation automatique.</p>';
  return `<div class="eyebrow">Conséquences sur les 4 prochaines semaines</div><ul>${ch.slice(0,12).map(x=>`<li><span class="mono">${DN[weekday(x)]} ${short(x)}</span> <s>${esc(nm(dutyIds(now[x])))}</s> → <b>${esc(nm(dutyIds(hyp[x])))}</b></li>`).join('')}</ul>${ch.length>12?`<p class="muted" style="font-size:.8rem">… et ${ch.length-12} autres jours.</p>`:''}`;
}
function closeModal(){$('#layer').innerHTML=''}
function setOverride(d,ids,mode){
  const m=monday(d),doc=state.affectations[m]||{cells:{}},cells={...doc.cells};
  if(ids===null)delete cells[d];else cells[d]={ids,mode:mode||'echange'};
  put('affectations',m,{cells});
  toast(ids===null?'Jour rendu à la rotation automatique.':mode==='decale'?'Tour avancé, la suite est décalée.':'Tours échangés.');
}

/* ---------- copie texte ---------- */
function weekText(){
  const m=ui.week,days=weekDays(m),plan=compute(m,addDays(m,4)),C=byId(),ts=taches();
  const nm=ids=>ids.map(id=>C[id]?.nom||'?').join(' et ')||'personne';
  let out=`Back office · semaine ${isoWeek(m)} (${longd(m)} – ${longd(addDays(m,4))})\n`;
  out+=`Programme : matin – ${slotTasks(ts,'matin').map(t=>t.nom).join(', ')||'—'} ; après-midi – ${slotTasks(ts,'apresmidi').map(t=>t.nom).join(', ')||'—'}\n\n`;
  for(const d of days){const P=plan[d];out+=`${DNL[weekday(d)]} ${short(d)} : `;
    if(P.ferie){out+=`férié (${P.ferie})\n`;continue}
    const same=P.matin.join()===P.apresmidi.join();
    out+=same?nm(P.matin):`matin ${nm(P.matin)}, après-midi ${nm(P.apresmidi)}`;
    if(P.absents.length)out+=`  (absents : ${P.absents.map(x=>C[x.id]?.nom).join(', ')})`;
    out+='\n'}
  return out;
}

/* ---------- événements ---------- */
let armed=null;

  const b=e.target.closest('[data-act],[data-tab]');if(!b)return;

  const a=b.dataset.act,id=b.dataset.id;
  if(a==='close'){if(e.target===b||b.tagName==='BUTTON')closeModal();return}
  if(['delc','dela','delt','clearov','delo'].includes(a)){
    if(armed!==b){document.querySelectorAll('.armed').forEach(x=>{x.classList.remove('armed');x.textContent=x.dataset.label||'Supprimer'});b.dataset.label=b.textContent;b.classList.add('armed');b.textContent='Confirmer';armed=b;setTimeout(()=>{if(armed===b){b.classList.remove('armed');b.textContent=b.dataset.label;armed=null}},4000);return}
    armed=null;
    if(a==='delc'){del('equipe',id);for(const [aid,ab] of Object.entries(state.absences))if(ab.collab===id)del('absences',aid)}
    if(a==='dela')del('absences',id);

      const dr=ui.orderDraft&&ui.orderDraft.from===F?ui.orderDraft:{from:F,ids:base};const ids=[...dr.ids],i=+b.dataset.i,j=a==='oup'?i-1:i+1;

    case 'ocancel':ui.orderDraft=null;render();break;

    case 'recfreq':{ui.recForm=readRecForm();ui.recForm.freq=b.dataset.v;render();break}
    case 'claim':claimMe(id||null);break;
    case 'link':{const c={...state.equipe[id],compte:b.dataset.u};put('equipe',id,c);toast('Compte relié.');break}

    case 'cal0':ui.calStart=null;render();break;
    case 'bulksave':{const rows=parseBulk(ui.bulkText||'').filter(r=>!r.err&&!r.dup);if(!rows.length)break;
      (async()=>{for(const r of rows)await put('absences',uid('a'),{collab:r.collab,du:r.du,au:r.au,type:r.type,portion:r.portion,note:r.note});
        ui.bulkText='';render();toast(`${rows.length} absence${rows.length>1?'s':''} enregistrée${rows.length>1?'s':''}. Le planning en tient compte.`)})();break}
    case 'wk':ui.week=addDays(ui.week,+b.dataset.n);render();break;

      try{navigator.clipboard.writeText(txt).then(()=>toast('Planning copié : collez-le dans un mail ou Teams.'),fb)}catch(err){fb()}break}
    case 'addc':{const team=collabs();const used=new Set(team.map(c=>c.couleur));let col=1;while(used.has(col)&&col<NCOL)col++;
      put('equipe',uid('c'),{nom:`Collaborateur ${team.length+1}`,couleur:col,actif:true,debut:'',fin:'',ordre:Math.max(0,...team.map(c=>c.ordre||0))+1});toast('Collaborateur ajouté en fin de liste.');break}
    case 'color':{const c=state.equipe[id];put('equipe',id,{...c,couleur:+b.dataset.c});break}
    case 'up':case 'down':{const team=collabs();const i=team.findIndex(c=>c.id===id),j=a==='up'?i-1:i+1;if(j<0||j>=team.length)break;
      team.forEach((c,k)=>c.ordre=k+1);[team[i].ordre,team[j].ordre]=[team[j].ordre,team[i].ordre];
      for(const c of [team[i],team[j]]){const {id:cid,_i,...rest}=c;put('equipe',cid,rest)}break}
    case 'tup':case 'tdown':{const ts=taches();const t=ts.find(x=>x.id===id);const same=ts.filter(x=>x.creneau===t.creneau);const i=same.indexOf(t),j=a==='tup'?i-1:i+1;if(j<0||j>=same.length)break;
      same.forEach((x,k)=>x.ordre=k+1);[same[i].ordre,same[j].ordre]=[same[j].ordre,same[i].ordre];
      for(const x of [same[i],same[j]]){const {id:tid,...rest}=x;put('taches',tid,rest)}break}
    case 'addt':{const ts=taches();put('taches',uid('t'),{nom:'Nouvelle tâche',desc:'',creneau:'matin',ordre:Math.max(0,...ts.map(t=>t.ordre||0))+1});break}
  }
});
